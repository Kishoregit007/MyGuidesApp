<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Senior Engineer's Domain Checklist</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap');

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #2563eb;
    --accent2: #3b82f6;
    --accent-glow: rgba(37,99,235,0.18);
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --purple: #8b5cf6;
    --cyan: #06b6d4;
    --orange: #f97316;
    --pink: #ec4899;
    --text: #e2e8f0;
    --text-muted: #64748b;
    --text-dim: #94a3b8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #0a0e1a 0%, #0f1d35 60%, #0a1628 100%);
    border-bottom: 1px solid var(--border);
    padding: 48px 32px 36px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(37,99,235,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent2);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(26px, 4vw, 44px);
    font-weight: 900;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 12px;
  }
  .header h1 span { color: var(--accent2); }
  .header p {
    color: var(--text-dim);
    font-size: 14px;
    max-width: 600px;
    font-weight: 300;
  }
  .header-meta {
    display: flex; gap: 24px; margin-top: 24px; flex-wrap: wrap;
  }
  .meta-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 4px;
    border: 1px solid;
  }
  .meta-pill.banking { color: var(--gold); border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.06); }
  .meta-pill.general { color: var(--cyan); border-color: rgba(6,182,212,0.3); background: rgba(6,182,212,0.06); }
  .meta-pill.count { color: var(--green); border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.06); }

  /* SEARCH & FILTER */
  .controls {
    padding: 20px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .search-box {
    flex: 1; min-width: 200px;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
  }
  .search-box input {
    background: none; border: none; outline: none;
    color: var(--text); font-size: 13px; width: 100%;
    font-family: 'Inter', sans-serif;
  }
  .search-box input::placeholder { color: var(--text-muted); }
  .search-icon { color: var(--text-muted); font-size: 14px; }
  .filter-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; padding: 6px 14px;
    border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text-muted);
    cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent2);
    color: var(--accent2);
    background: var(--accent-glow);
  }

  /* PROGRESS */
  .progress-bar-wrap {
    padding: 14px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
  }
  .progress-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .progress-track {
    flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan));
    border-radius: 99px; transition: width 0.4s ease;
    width: 0%;
  }
  .progress-count { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent2); }

  /* MAIN */
  .main { padding: 28px 32px; max-width: 1100px; margin: 0 auto; }

  /* DOMAIN CARD */
  .domain-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .domain-card:hover { border-color: #2a3f5f; }
  .domain-card.hidden { display: none; }

  .domain-header {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 22px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .domain-header:hover { background: var(--surface2); }

  .domain-icon {
    width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .domain-title-block { flex: 1; }
  .domain-title {
    font-size: 15px; font-weight: 600; color: #fff;
    display: flex; align-items: center; gap: 8px;
  }
  .domain-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .domain-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px; padding: 2px 8px;
    border-radius: 3px; border: 1px solid;
    margin-left: 6px;
  }
  .domain-stats {
    display: flex; gap: 16px; align-items: center;
  }
  .stat-ring {
    width: 36px; height: 36px; position: relative; flex-shrink: 0;
  }
  .stat-ring svg { transform: rotate(-90deg); }
  .stat-ring .ring-bg { fill: none; stroke: var(--border); stroke-width: 3; }
  .stat-ring .ring-fill { fill: none; stroke-width: 3; stroke-linecap: round;
    transition: stroke-dashoffset 0.5s ease; }
  .stat-ring .ring-text {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: var(--text-dim);
  }
  .chevron {
    color: var(--text-muted); font-size: 14px; transition: transform 0.25s;
    flex-shrink: 0;
  }
  .domain-card.open .chevron { transform: rotate(180deg); }

  .domain-body {
    display: none; padding: 0 22px 20px;
    border-top: 1px solid var(--border);
  }
  .domain-card.open .domain-body { display: block; }

  /* ITEMS */
  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .item:hover { border-color: #2a3f5f; background: #0d1322; }
  .item.checked { border-color: rgba(16,185,129,0.25); background: rgba(16,185,129,0.04); }
  .item-cb {
    width: 18px; height: 18px; border-radius: 4px;
    border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 2px; transition: all 0.15s;
    background: var(--surface);
  }
  .item.checked .item-cb {
    background: var(--green); border-color: var(--green); color: #fff;
  }
  .item-cb-check { display: none; font-size: 11px; }
  .item.checked .item-cb-check { display: block; }
  .item-text { flex: 1; }
  .item-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .item.checked .item-title { color: var(--text-muted); text-decoration: line-through; }
  .item-desc { font-size: 11px; color: var(--text-muted); margin-top: 3px; line-height: 1.5; }
  .item-tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px; padding: 2px 6px; border-radius: 3px;
    border: 1px solid; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .tag.banking { color: var(--gold); border-color: rgba(245,158,11,0.25); }
  .tag.critical { color: var(--red); border-color: rgba(239,68,68,0.25); }
  .tag.perf { color: var(--cyan); border-color: rgba(6,182,212,0.25); }
  .tag.security { color: var(--purple); border-color: rgba(139,92,246,0.25); }
  .tag.ux { color: var(--pink); border-color: rgba(236,72,153,0.25); }
  .tag.ops { color: var(--orange); border-color: rgba(249,115,22,0.25); }

  /* RESET */
  .reset-btn {
    margin-top: 24px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; padding: 8px 20px;
    border-radius: 5px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted);
    cursor: pointer; transition: all 0.2s; display: block; margin-left: auto;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  /* COLORS per domain */
  .c-blue   { background: rgba(37,99,235,0.12); color: var(--accent2); }
  .c-gold   { background: rgba(245,158,11,0.12); color: var(--gold); }
  .c-green  { background: rgba(16,185,129,0.12); color: var(--green); }
  .c-red    { background: rgba(239,68,68,0.12); color: var(--red); }
  .c-purple { background: rgba(139,92,246,0.12); color: var(--purple); }
  .c-cyan   { background: rgba(6,182,212,0.12); color: var(--cyan); }
  .c-orange { background: rgba(249,115,22,0.12); color: var(--orange); }
  .c-pink   { background: rgba(236,72,153,0.12); color: var(--pink); }
  .c-teal   { background: rgba(20,184,166,0.12); color: #14b8a6; }
  .c-indigo { background: rgba(99,102,241,0.12); color: #818cf8; }
  .c-rose   { background: rgba(244,63,94,0.12); color: #fb7185; }
  .c-lime   { background: rgba(132,204,22,0.12); color: #a3e635; }

  .badge-banking { color: var(--gold); border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.06); }
  .badge-critical { color: var(--red); border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.06); }

  @media (max-width: 600px) {
    .main, .controls, .header, .progress-bar-wrap { padding-left: 16px; padding-right: 16px; }
    .items-grid { grid-template-columns: 1fr; }
    .domain-stats { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-tag">// Senior Engineer's Reference</div>
  <h1>Product Development<br/><span>Domain Checklist</span></h1>
  <p>Every dimension a senior engineer must evaluate — from first commit to production and beyond. Calibrated for banking-grade products.</p>
  <div class="header-meta">
    <span class="meta-pill banking">⚑ Banking Client Context</span>
    <span class="meta-pill general">◎ General Purpose</span>
    <span class="meta-pill count" id="total-count">Loading...</span>
  </div>
</div>

<div class="controls">
  <div class="search-box">
    <span class="search-icon">⌕</span>
    <input type="text" id="search-input" placeholder="Search domains, items, tags…"/>
  </div>
  <div class="filter-btns">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="critical">Critical</button>
    <button class="filter-btn" data-filter="banking">Banking</button>
    <button class="filter-btn" data-filter="security">Security</button>
    <button class="filter-btn" data-filter="perf">Performance</button>
  </div>
</div>

<div class="progress-bar-wrap">
  <span class="progress-label">Checklist Progress</span>
  <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
  <span class="progress-count" id="prog-text">0 / 0</span>
</div>

<div class="main" id="main-container"></div>

<script>
const DOMAINS = [
  {
    id: "architecture",
    icon: "🏗️",
    color: "c-blue",
    title: "System Architecture & Design",
    subtitle: "Structural decisions that define the entire system",
    badge: "critical",
    items: [
      { title: "Monolith vs Microservices decision", desc: "Evaluate coupling, team size, deployment complexity, and future scaling needs. Banking systems often start modular.", tags: ["critical","banking"] },
      { title: "Domain-Driven Design (DDD)", desc: "Define bounded contexts, aggregates, and domain events — especially critical when dealing with accounts, transactions, and customers.", tags: ["banking"] },
      { title: "API contract design (REST / GraphQL / gRPC)", desc: "Versioning strategy, backward compatibility, contract-first design (OpenAPI/Protobuf).", tags: ["critical"] },
      { title: "Event-driven vs request-response", desc: "When to use async messaging (Kafka, RabbitMQ) vs synchronous APIs. Payment systems often need event sourcing.", tags: ["banking","perf"] },
      { title: "Database architecture", desc: "RDBMS vs NoSQL, sharding, read replicas, CQRS pattern, polyglot persistence strategy.", tags: ["critical"] },
      { title: "Caching strategy", desc: "L1/L2 cache layers, Redis/Memcached, cache invalidation, TTL policies, stale-while-revalidate.", tags: ["perf"] },
      { title: "Synchronous vs asynchronous workflows", desc: "Identify long-running processes (KYC, loan processing) that need async queues with status polling.", tags: ["banking"] },
      { title: "Integration architecture", desc: "ESB, API gateway, or point-to-point? Core banking system (CBS) integration, SWIFT, payment rails.", tags: ["banking","critical"] },
      { title: "Data consistency model", desc: "Strong consistency vs eventual consistency. Banking ledger entries require ACID guarantees.", tags: ["banking","critical"] },
      { title: "Idempotency design", desc: "Every financial operation must be idempotent — duplicate requests must not double-charge or double-credit.", tags: ["banking","critical"] },
    ]
  },
  {
    id: "scalability",
    icon: "📈",
    color: "c-cyan",
    title: "Scalability & Performance",
    subtitle: "Will it hold under 10x, 100x, 1000x load?",
    badge: "critical",
    items: [
      { title: "Vertical vs horizontal scaling plan", desc: "Stateless services enable horizontal scaling. Identify stateful bottlenecks early.", tags: ["critical","perf"] },
      { title: "Throughput & latency targets (SLOs)", desc: "Define P50/P95/P99 latency targets. Banking APIs typically need <200ms P95.", tags: ["banking","perf","critical"] },
      { title: "Load testing & benchmarking", desc: "Use k6, JMeter, Locust. Simulate peak traffic (month-end, salary day for banks).", tags: ["perf","banking"] },
      { title: "Connection pooling", desc: "DB connection pools (HikariCP, PgBouncer), HTTP connection reuse, thread pool sizing.", tags: ["perf"] },
      { title: "Rate limiting & throttling", desc: "Per-user, per-IP, per-API-key limits. Prevent abuse and protect downstream services.", tags: ["security","banking"] },
      { title: "Database query optimization", desc: "Index analysis, EXPLAIN plans, N+1 query detection, read replica offloading.", tags: ["perf"] },
      { title: "CDN & static asset strategy", desc: "Offload static content. Cache API responses at edge where safe.", tags: ["perf"] },
      { title: "Auto-scaling policies", desc: "CPU/memory thresholds, predictive scaling for known peaks (salary day, quarter-end).", tags: ["ops","banking"] },
      { title: "Backpressure handling", desc: "What happens when downstream is slow? Circuit breakers, bulkheads, queue depth monitoring.", tags: ["perf","critical"] },
    ]
  },
  {
    id: "security",
    icon: "🔐",
    color: "c-purple",
    title: "Security & Compliance",
    subtitle: "Non-negotiable for banking — but universal best practice",
    badge: "banking",
    items: [
      { title: "Authentication & authorization model", desc: "OAuth2/OIDC, JWT, session management, MFA/OTP — especially for banking portals.", tags: ["security","critical","banking"] },
      { title: "Role-Based Access Control (RBAC)", desc: "Principle of least privilege. Maker-checker workflows for financial transactions.", tags: ["security","banking"] },
      { title: "Data encryption (in transit + at rest)", desc: "TLS 1.2+ everywhere, AES-256 for stored data, field-level encryption for PII/card data.", tags: ["security","critical","banking"] },
      { title: "Secrets management", desc: "HashiCorp Vault, AWS Secrets Manager, Azure Key Vault. Never hardcode credentials.", tags: ["security","critical"] },
      { title: "Input validation & sanitization", desc: "OWASP Top 10 — SQL injection, XSS, CSRF, insecure deserialization. Validate all inputs.", tags: ["security","critical"] },
      { title: "Regulatory compliance", desc: "RBI guidelines, PCI-DSS (card data), GDPR/DPDP Act (India), ISO 27001 controls.", tags: ["banking","critical"] },
      { title: "Audit logging & non-repudiation", desc: "Every financial action must be timestamped, actor-stamped, and tamper-proof. Regulators will ask.", tags: ["banking","critical","security"] },
      { title: "Penetration testing plan", desc: "VAPT before go-live. Banking apps require periodic external pen tests.", tags: ["security","banking"] },
      { title: "DDoS protection", desc: "WAF, Cloudflare/Akamai, rate limits, CAPTCHA for sensitive flows.", tags: ["security"] },
      { title: "Fraud detection hooks", desc: "Anomaly detection on transactions, velocity checks, device fingerprinting, IP reputation.", tags: ["banking","security"] },
      { title: "Data masking & tokenization", desc: "Mask PAN, Aadhaar, account numbers in logs, UI, and non-prod environments.", tags: ["banking","security"] },
    ]
  },
  {
    id: "reliability",
    icon: "🛡️",
    color: "c-green",
    title: "Reliability & Resilience",
    subtitle: "Systems fail — design for graceful degradation",
    badge: "critical",
    items: [
      { title: "SLA / SLO / SLI definition", desc: "99.9% vs 99.99% uptime — the difference is hours of allowed downtime per year. Banking usually needs 99.99%.", tags: ["banking","critical"] },
      { title: "Circuit breaker pattern", desc: "Hystrix/Resilience4j. Prevent cascade failures when CBS or payment gateway is slow.", tags: ["critical","banking"] },
      { title: "Retry logic with exponential backoff", desc: "Idempotent retries with jitter. Avoid thundering herd after an outage.", tags: ["critical"] },
      { title: "Graceful degradation", desc: "What features degrade if a service is down? Show cached balance vs error screen.", tags: ["ux"] },
      { title: "Bulkhead pattern", desc: "Isolate thread pools/resources between features so one failure doesn't starve others.", tags: ["perf"] },
      { title: "Health checks & readiness probes", desc: "Liveness vs readiness in Kubernetes. Proper startup grace periods.", tags: ["ops"] },
      { title: "Chaos engineering plan", desc: "Netflix Chaos Monkey, Gremlin — simulate node failures, network latency, DB outages.", tags: ["ops"] },
      { title: "Disaster Recovery (DR) plan", desc: "RTO and RPO targets. Multi-region or multi-AZ. Banking regulators require documented DR.", tags: ["banking","critical"] },
      { title: "Data backup & restore testing", desc: "Automated backups are useless unless restores are tested. Schedule quarterly drills.", tags: ["critical","banking"] },
    ]
  },
  {
    id: "data",
    icon: "🗄️",
    color: "c-gold",
    title: "Data Engineering & Management",
    subtitle: "Data is the product — especially in banking",
    badge: "banking",
    items: [
      { title: "Data modeling & schema design", desc: "Normalization vs denormalization trade-offs. Soft deletes vs hard deletes. Temporal tables for banking history.", tags: ["banking"] },
      { title: "Migration strategy", desc: "Zero-downtime migrations, backward-compatible schema changes, Flyway/Liquibase.", tags: ["critical"] },
      { title: "Data lineage & provenance", desc: "Where did this transaction originate? Critical for audit trails and regulatory reporting.", tags: ["banking"] },
      { title: "Master data management", desc: "Single source of truth for customer, account, product data. Deduplication logic.", tags: ["banking"] },
      { title: "Data retention & archival policy", desc: "Banking data typically retained 7+ years. Cold storage (S3 Glacier, Azure Archive).", tags: ["banking"] },
      { title: "GDPR / DPDP Act compliance", desc: "Right to erasure, data portability, consent management, data processing records.", tags: ["banking","security"] },
      { title: "Analytics & reporting architecture", desc: "OLTP vs OLAP separation. Data warehouse, data lake, or lakehouse (Databricks/Snowflake).", tags: ["banking"] },
      { title: "Real-time vs batch processing", desc: "Kafka Streams, Flink for real-time. Spark/Airflow for batch. Know which fits which use case.", tags: ["perf"] },
      { title: "Data quality & validation", desc: "Schema validation, referential integrity, reconciliation jobs for ledger balancing.", tags: ["banking","critical"] },
    ]
  },
  {
    id: "devops",
    icon: "⚙️",
    color: "c-orange",
    title: "DevOps, CI/CD & Infrastructure",
    subtitle: "The deployment pipeline is a product too",
    items: [
      { title: "CI/CD pipeline design", desc: "Build → Test → SAST → DAST → Stage → Prod gates. No code merges without pipeline green.", tags: ["critical"] },
      { title: "Infrastructure as Code (IaC)", desc: "Terraform, Pulumi, CloudFormation. Reproducible, auditable infrastructure for compliance.", tags: ["banking","ops"] },
      { title: "Container strategy", desc: "Docker + Kubernetes. Pod resource limits, namespace isolation, network policies.", tags: ["ops"] },
      { title: "Environment parity", desc: "Dev → QA → Staging → Prod must be as identical as possible to catch environment-specific bugs.", tags: ["ops"] },
      { title: "Feature flags", desc: "LaunchDarkly, Unleash. Deploy code without activating features. Essential for phased banking rollouts.", tags: ["banking","ops"] },
      { title: "Blue/Green & Canary deployments", desc: "Zero-downtime deploys. Canary with 5% traffic before full rollout for high-risk banking features.", tags: ["ops","banking"] },
      { title: "Rollback strategy", desc: "Automated rollback triggers. Can you roll back a DB migration? Plan before you need it.", tags: ["critical","ops"] },
      { title: "Cost optimization", desc: "Reserved instances, spot instances, right-sizing, unused resource cleanup. Cloud bills compound.", tags: ["ops"] },
      { title: "Multi-cloud / hybrid cloud strategy", desc: "RBI mandates data localization. On-prem CBS + cloud app tier is common in Indian banking.", tags: ["banking","ops"] },
    ]
  },
  {
    id: "observability",
    icon: "📊",
    color: "c-teal",
    title: "Observability & Monitoring",
    subtitle: "You can't fix what you can't see",
    items: [
      { title: "Structured logging", desc: "JSON logs with correlation IDs, trace IDs, user context. ELK / Splunk / Datadog.", tags: ["critical"] },
      { title: "Distributed tracing", desc: "Jaeger, Zipkin, OpenTelemetry. Trace a payment request across 8 microservices.", tags: ["perf","banking"] },
      { title: "Metrics & dashboards", desc: "Prometheus + Grafana. Business metrics (TPS, payment success rate) + infra metrics.", tags: ["critical"] },
      { title: "Alerting & on-call", desc: "PagerDuty/OpsGenie. Alert on symptoms not causes. Runbooks for every alert.", tags: ["ops","critical"] },

// --- Build UI ---
let checkedItems = new Set(JSON.parse(localStorage.getItem('eng-checklist') || '[]'));

function saveState() {
  localStorage.setItem('eng-checklist', JSON.stringify([...checkedItems]));
}

function getItemId(domainId, idx) { return `${domainId}-${idx}`; }

function renderDomains(filterTag = 'all', searchTerm = '') {
  const container = document.getElementById('main-container');
  container.innerHTML = '';

  let totalItems = 0, totalChecked = 0;

  DOMAINS.forEach(domain => {
    let filteredItems = domain.items;
    if (filterTag !== 'all') {
      filteredItems = filteredItems.filter(it => it.tags.includes(filterTag));
    }
    if (searchTerm) {
      const s = searchTerm.toLowerCase();
      filteredItems = filteredItems.filter(it =>
        it.title.toLowerCase().includes(s) ||
        it.desc.toLowerCase().includes(s) ||
        it.tags.some(t => t.includes(s)) ||
        domain.title.toLowerCase().includes(s)
      );
    }
    if (filteredItems.length === 0) return;

    const domainChecked = filteredItems.filter((_, i) => {
      const idx = domain.items.indexOf(filteredItems[i]);
      return checkedItems.has(getItemId(domain.id, idx));
    }).length;

    totalItems += filteredItems.length;
    totalChecked += domainChecked;

    const progress = filteredItems.length > 0 ? (domainChecked / filteredItems.length) : 0;
    const circumference = 2 * Math.PI * 14;
    const dashOffset = circumference * (1 - progress);

    // Pick stroke color
    const strokeColor = progress === 1 ? '#10b981' : progress > 0.5 ? '#3b82f6' : '#f59e0b';

    const card = document.createElement('div');
    card.className = 'domain-card';
    card.id = `card-${domain.id}`;

    const badgeHtml = domain.badge
      ? `<span class="domain-badge ${domain.badge === 'banking' ? 'badge-banking' : 'badge-critical'}">${domain.badge === 'banking' ? '⚑ Banking' : '⚠ Critical'}</span>`
      : '';

    card.innerHTML = `
      <div class="domain-header" onclick="toggleCard('${domain.id}')">
        <div class="domain-icon ${domain.color}">${domain.icon}</div>
        <div class="domain-title-block">
          <div class="domain-title">${domain.title}${badgeHtml}</div>
          <div class="domain-subtitle">${domain.subtitle}</div>
        </div>
        <div class="domain-stats">
          <div class="stat-ring">
            <svg viewBox="0 0 32 32" width="36" height="36">
              <circle class="ring-bg" cx="16" cy="16" r="14"/>
              <circle class="ring-fill" cx="16" cy="16" r="14"
                stroke="${strokeColor}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${dashOffset}"/>
            </svg>
            <div class="ring-text">${domainChecked}/${filteredItems.length}</div>
          </div>
        </div>
        <div class="chevron">▼</div>
      </div>
      <div class="domain-body">
        <div class="items-grid" id="grid-${domain.id}">
          ${filteredItems.map((item, visIdx) => {
            const realIdx = domain.items.indexOf(item);
            const id = getItemId(domain.id, realIdx);
            const checked = checkedItems.has(id);
            return `
              <div class="item ${checked ? 'checked' : ''}" id="item-${id}" onclick="toggleItem('${domain.id}', ${realIdx})">
                <div class="item-cb">
                  <span class="item-cb-check">✓</span>
                </div>
                <div class="item-text">
                  <div class="item-title">${item.title}</div>
                  <div class="item-desc">${item.desc}</div>
                  <div class="item-tags">
                    ${item.tags.map(t => `<span class="tag ${t}">${t}</span>`).join('')}
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>
      </div>`;

    container.appendChild(card);
  });

  // Update progress
  const pct = totalItems ? (totalChecked / totalItems * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = `${totalChecked} / ${totalItems}`;
  document.getElementById('total-count').textContent = `${totalItems} checkpoints`;

  // Reset button
  const rb = document.createElement('button');
  rb.className = 'reset-btn';
  rb.textContent = '⟳ Reset All Checks';
  rb.onclick = () => { checkedItems.clear(); saveState(); renderDomains(currentFilter, currentSearch); };
  container.appendChild(rb);
}

function toggleCard(id) {
  const card = document.getElementById(`card-${id}`);
  card.classList.toggle('open');
}

function toggleItem(domainId, idx) {
  const id = getItemId(domainId, idx);
  const el = document.getElementById(`item-${id}`);
  if (checkedItems.has(id)) {
    checkedItems.delete(id);
    el.classList.remove('checked');
  } else {
    checkedItems.add(id);
    el.classList.add('checked');
  }
  saveState();
  // Re-render rings without full re-render
  renderDomains(currentFilter, currentSearch);
  // Re-open the card
  setTimeout(() => {
    const card = document.getElementById(`card-${domainId}`);
    if (card) card.classList.add('open');
  }, 0);
}

let currentFilter = 'all';
let currentSearch = '';

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderDomains(currentFilter, currentSearch);
  });
});

document.getElementById('search-input').addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  renderDomains(currentFilter, currentSearch);
});

// Initial render
renderDomains();
// Open first card
setTimeout(() => {
  const first = document.querySelector('.domain-card');
  if (first) first.classList.add('open');
}, 50);
</script>
